<!doctype html>
<html lang="en">
<head>
<base target="_top" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="icon" href="icon.png" type="image/png" />
<title>first</title>
<!--
  ⚠️ Presents the 7 skills as Tau’s own (/tau commands, npx @tau/skills) — they must
  exist before this goes live.
  An article built on the structure of attio.com/startups (centred hero, split
  offer with a form panel, two-tone section heads, [01] tiles with live UI,
  FAQ with [+]), with Tau's bright CTA bands from cta-blocks.html — improved:
  one action everywhere ("Launch my agent"), the role field inside the bands,
  live product UI. Built by design/build-cta.py → public/article-attio.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1c1d1f; --body: #3c3e43; --muted: #6f7277; --meta: #6e7177; --faint: #9a9da3;
    --line: #ececee; --line-2: #e6e7ea; --panel: #f7f7f8; --chip: #f1f1f3;
    --violet: #6d5dfb; --violet-ink: #5644e6; --violet-bg: #f1efff;
    --green: #1a7f3c; --green-dot: #22a35a; --green-bg: #e7f6ec;
    --grad: linear-gradient(90deg, #2563eb 0%, #6d5dfb 52%, #9333ea 100%);
    --grad-d: linear-gradient(140deg, #2563eb 0%, #6d5dfb 55%, #9333ea 100%);
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  /* Attio's dotted side rails: the page ground is dots, the frame is white */
  body { margin: 0; color: var(--ink); font: 400 16px/1.5 Inter, system-ui, sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; background: #fff radial-gradient(circle, #dcdee2 1px, transparent 1.2px) 0 0 / 14px 14px; }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; }
  .frame { position: relative; max-width: 1280px; margin: 0 auto; background: #fff; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mono { font-family: var(--mono); }
  .grey { color: var(--meta); }

  /* header */
  .nav { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.86); backdrop-filter: blur(12px); }
  .nav .frame { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 28px; background: transparent; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; }
  .nav .links { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .nav .links a.ghost { padding: 6px 12px; color: var(--muted); }
  .nav .links a.cta { padding: 7px 12px; border-radius: 10px; background: var(--ink); color: #fff; }

  section { border-bottom: 1px solid var(--line); }

  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; font-weight: 500; color: var(--body); background: #fff; }
  /* ═══ 1 · hero: title left, the minimal Ink card right (article-hero-minimal.html) */
  .mhero .frame { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px); gap: 72px; align-items: center; padding: 80px 72px; min-height: 640px; }
  .mhero h1 { margin: 22px 0 0; font-size: clamp(2.6rem, 4.8vw, 4.2rem); line-height: 1.02; letter-spacing: -.05em; font-weight: 600; text-wrap: balance; }
  .mhero p.lead { margin: 20px 0 0; max-width: 560px; font-size: 19px; color: var(--muted); }
  .mhero .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 24px; font-size: 14px; color: var(--meta); font-weight: 500; }
  .mhero .runs { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); max-width: 560px; }
  .mhero .runs small { display: block; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--meta); }
  .mhero .runs div { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; font-size: 16px; font-weight: 600; color: #6e7177; letter-spacing: -.02em; }
  /* hero card: the Ink card — a quiet line and the agent's log, new roles keep arriving */
  .x2 { position: relative; overflow: hidden; border-radius: 26px; padding: 40px; background: #0e0e0f; color: #fff; min-height: 520px; display: flex; flex-direction: column; }
  .x2 .k { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #8b8e94; }
  .x2 h2 { margin: 24px 0 0; font-size: 40px; line-height: 1.04; letter-spacing: -.045em; font-weight: 500; }
  .x2 h2 em { font-style: normal; color: #8b8e94; }
  /* the log is a fixed window (5 rows) — rows ride up like a conveyor, so the card never changes height */
  .x2 .log { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; margin: 34px 0 30px; }
  .x2 .lwin { position: relative; height: 180px; overflow: hidden; -webkit-mask-image: linear-gradient(transparent 0, #000 42%); mask-image: linear-gradient(transparent 0, #000 42%); }
  .x2 .ltrack { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; font: 400 13.5px/1 var(--mono); }
  .x2 .ltrack.moving { transition: transform .7s cubic-bezier(.65,0,.35,1); }
  .x2 .row { display: flex; align-items: center; gap: 10px; height: 36px; color: #c4c6cc; white-space: nowrap; }
  .x2 .row i { width: 6px; height: 6px; border-radius: 50%; background: var(--green-dot); flex: none; }
  .x2 .row .st { min-width: 74px; }
  .x2 .row .nm { overflow: hidden; text-overflow: ellipsis; }
  .x2 .row em { font-style: normal; color: #8b8e94; margin-left: auto; }
  .x2 .row.work i { background: #a78bfa; box-shadow: 0 0 0 0 rgba(167,139,250,.5); animation: halo 1s ease-out infinite; }
  .x2 .row.work .st { color: #a78bfa; }
  .x2 .row.work .st::after { content: ""; display: inline-block; width: 1.4em; text-align: left; animation: dots 1s steps(4) infinite; }
  .x2 .row.ok .st { color: #4ade80; animation: okpop .5s cubic-bezier(.34,1.56,.64,1); display: inline-block; }
  @keyframes halo { to { box-shadow: 0 0 0 8px rgba(167,139,250,0); } }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @keyframes okpop { 0% { transform: translateY(6px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .x2 .pillbtn { background: #fff; color: var(--ink); align-self: flex-start; }
  .pillbtn { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 26px; border-radius: 999px; font-weight: 500; font-size: 16px; }
  .tlink { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 17px; padding-bottom: 5px; border-bottom: 1px solid currentColor; }
  .arrow { display: inline-block; transition: transform .25s cubic-bezier(.16,1,.3,1); }
  a:hover .arrow { transform: translateX(4px); }

  /* ═══ 2 · flow: the seven skills as a pipeline */
  .flow .frame { padding: 96px 72px; }
  .flow h2 { margin: 0 auto; max-width: 760px; text-align: center; font-size: clamp(2rem, 3.4vw, 2.8rem); line-height: 1.08; letter-spacing: -.04em; font-weight: 600; }
  .flow h2 span { color: var(--meta); }
  .track { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin: 64px 0 0; }
  .track::before { content: ""; position: absolute; left: 7%; right: 7%; top: 44px; border-top: 1px dashed var(--faint); }
  .runner { position: absolute; top: 40px; left: 7%; width: 9px; height: 9px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 0 6px rgba(109,93,251,.15); animation: run 7s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes run { 0% { left: 7%; opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } 100% { left: 93%; opacity: 0; } }
  .node { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  .node img { width: 88px; height: 88px; object-fit: contain; padding: 12px; border-radius: 22px; background: #fff; border: 1px solid var(--line); box-shadow: 0 14px 30px -18px rgba(30,30,80,.35); transition: transform .3s cubic-bezier(.16,1,.3,1); }
  .node:hover img { transform: translateY(-4px); }
  .node b { margin-top: 10px; font-size: 16px; letter-spacing: -.02em; }
  .node code { font: 400 12px var(--mono); color: var(--violet-ink); }
  .gets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 72px; border-top: 1px solid var(--line); }
  .gets > div { padding: 28px 28px 0 0; }
  .gets > div + div { padding-left: 28px; border-left: 1px solid var(--line); }
  .gets .n { font: 500 12.5px var(--mono); color: var(--meta); }
  .gets b { display: block; margin-top: 10px; font-size: 20px; letter-spacing: -.025em; }
  .gets p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  /* shared bits (form, logos, pills) — used by the hero, tiles and bands */
  .logo { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; }
  .logo svg { width: 58%; height: 58%; fill: #fff; }
  .pill2 { align-items: center; gap: 5px; border-radius: 7px; padding: 3px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .p-a { background: var(--green-bg); color: var(--green); } .p-t { background: var(--violet-bg); color: var(--violet-ink); } .p-q { color: var(--meta); font-weight: 500; }
  .spin { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .trust { position: relative; margin-top: 12px; font-size: 12.5px; }

  /* the one CTA button (no role field) */
  .cbtn { display: inline-flex; align-items: center; gap: 10px; height: 54px; margin-top: 30px; padding: 0 26px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600; font-size: 16px; box-shadow: 0 14px 30px -14px rgba(28,29,31,.55); transition: background .2s; }
  .cbtn:hover { background: #000; }
  .cbtn svg { width: 16px; height: 16px; transition: transform .2s; }
  .cbtn:hover svg { transform: translateX(3px); }
  .band.dark .cbtn { background: #fff; color: var(--ink); box-shadow: none; }
  .band.dark .cbtn:hover { background: rgba(255,255,255,.9); }
  .endcta .cbtn.end { margin-top: 40px; }
  /* ═══ two-tone section head (Attio) */
  .shead .frame { padding: 96px 72px 64px; }
  .shead h2 { margin: 0; max-width: 820px; font-size: clamp(2rem, 3.6vw, 2.9rem); line-height: 1.08; letter-spacing: -.04em; font-weight: 600; }
  .shead h2 span { color: var(--meta); }

  /* ═══ [01] tiles, two per row, each with a small live UI */
  /* full-bleed in the frame, only the inner dividers (no outer lines doubling the frame) */
  .tiles .frame { display: grid; grid-template-columns: 1fr 1fr; }
  .tile { position: relative; display: flex; flex-direction: column; min-height: 420px; padding: 32px 40px; border-top: 1px solid var(--line); }
  .tile:nth-child(-n+2) { border-top: 0; }
  .tile:nth-child(odd) { border-right: 1px solid var(--line); }
  .tile .n { font: 400 12.5px var(--mono); color: var(--meta); }
  .tile .vis { flex: 1; display: flex; align-items: center; justify-content: center; padding: 26px 0; }
  .tile h3 { margin: 0; font-size: 19px; letter-spacing: -.02em; font-weight: 600; }
  .tile p { margin: 4px 0 0; color: var(--meta); font-size: 15.5px; }
  .tile code { font: 400 13px var(--mono); color: var(--violet-ink); }
  .ui { width: min(340px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 18px 40px -22px rgba(16,24,40,.25); font-size: 13px; overflow: hidden; }
  .ui .bar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); color: var(--meta); font: 400 11.5px var(--mono); }
  .ui .bar i { width: 8px; height: 8px; border-radius: 50%; background: var(--chip); }
  .ui .bd { padding: 12px 14px; font: 400 12.5px/1.6 var(--mono); color: var(--body); }
  .ui .bd .p { color: var(--violet); } .ui .bd .ok { color: var(--green); } .ui .bd .dim { color: var(--meta); } .ui .bd .hi { color: #b45309; }
  .score { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 14px; }
  .score div { text-align: center; padding: 8px 0; border-radius: 10px; background: var(--panel); font: 500 11px var(--mono); color: var(--meta); }
  .score div b { display: block; font: 600 17px Inter, sans-serif; color: var(--ink); }
  .score .tot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--green-bg); color: var(--green); font: 600 13px Inter, sans-serif; }
  .kw { border-radius: 4px; padding: 0 3px; background: var(--violet-bg); color: var(--violet-ink); font-weight: 600; }
  .tile.tau { color: #fff; background: var(--grad-d); overflow: hidden; }
  .tile.tau .n { color: rgba(255,255,255,.7); }
  .tile.tau p { color: rgba(255,255,255,.82); }
  /* the rocket: a launch loop — rumbles with exhaust puffs, blasts off to the top-right with speed
     streaks, comes back in from the bottom-left and settles (5s) */
  .tile.tau .vis { position: relative; }
  .rocket { position: relative; z-index: 2; width: 240px; filter: drop-shadow(0 24px 34px rgba(20,10,80,.4)); animation: launch 5s cubic-bezier(.45,0,.2,1) infinite; }
  @keyframes launch {
    0% { transform: translate(0, 0); }
    4%, 12%, 20% { transform: translate(-2px, 1px) rotate(-1deg); }
    8%, 16%, 24% { transform: translate(2px, -1px) rotate(1deg); }
    28% { transform: translate(-6px, 6px); }
    48% { transform: translate(340px, -340px) scale(.9); opacity: 1; }
    48.1% { transform: translate(-340px, 340px) scale(.9); opacity: 0; }
    56% { opacity: 1; }
    80%, 100% { transform: translate(0, 0); }
  }
  .puffs i { position: absolute; z-index: 1; left: calc(50% - 86px); top: calc(50% + 50px); width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.75); filter: blur(2px); opacity: 0; animation: puff 5s ease-out infinite; }
  .puffs i:nth-child(2) { animation-delay: .25s; left: calc(50% - 104px); top: calc(50% + 66px); width: 26px; height: 26px; }
  .puffs i:nth-child(3) { animation-delay: .5s; left: calc(50% - 70px); top: calc(50% + 74px); width: 22px; height: 22px; }
  @keyframes puff { 0% { opacity: 0; transform: scale(.3); } 6% { opacity: .9; } 30% { opacity: 0; transform: translate(-30px, 30px) scale(1.8); } 100% { opacity: 0; } }
  .streaks i { position: absolute; z-index: 0; left: 50%; top: 50%; width: 2px; height: 120px; border-radius: 2px; background: linear-gradient(transparent, rgba(255,255,255,.75)); transform: rotate(45deg) translateY(-260px); opacity: 0; animation: streak 5s linear infinite; }
  .streaks i:nth-child(1) { margin-left: -80px; } .streaks i:nth-child(2) { margin-left: -20px; animation-delay: .08s; } .streaks i:nth-child(3) { margin-left: 40px; animation-delay: .16s; } .streaks i:nth-child(4) { margin-left: -140px; animation-delay: .12s; } .streaks i:nth-child(5) { margin-left: 90px; animation-delay: .04s; }
  @keyframes streak { 0%, 27% { opacity: 0; transform: rotate(45deg) translateY(-260px); } 32% { opacity: 1; } 50% { opacity: 0; transform: rotate(45deg) translateY(260px); } 100% { opacity: 0; transform: rotate(45deg) translateY(260px); } }

  /* ═══ bright CTA bands (from cta-blocks.html, improved) */
  .band .frame { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); min-height: 520px; }
  .band .copy { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 64px 72px; }
  .band .eyebrow { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
  .band h2 { margin: 18px 0 0; font-size: clamp(2rem, 3.3vw, 2.9rem); line-height: 1.04; letter-spacing: -.045em; font-weight: 700; text-wrap: balance; }
  .band p.lead { margin: 16px 0 0; max-width: 440px; font-size: 18px; }
  .band .stage { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 48px; }
  .anim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* dark band */
  .band.dark .frame { background: #111; color: #fff; border-color: rgba(255,255,255,.1); }
  .band.dark .eyebrow { background: rgba(255,255,255,.07); color: #c4b5fd; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  .band.dark p.lead { color: #a1a4a9; }
  .band.dark .stage { border-left: 1px solid rgba(255,255,255,.1); }
  .band.dark .trust { color: #8b8e94; }
  .feed { position: relative; z-index: 1; width: min(460px, 100%); display: grid; gap: 10px; }
  .feed .c { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 14px; background: #fff; color: var(--ink); box-shadow: 0 20px 40px -24px rgba(0,0,0,.6); animation: drop 6s cubic-bezier(.16,1,.3,1) infinite; }
  .feed .c:nth-child(2) { animation-delay: .15s; } .feed .c:nth-child(3) { animation-delay: .3s; }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-12px); } 8%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .feed .c .t { flex: 1; min-width: 0; line-height: 1.25; }
  .feed .c .t b { display: block; font-size: 14.5px; }
  .feed .c .t span { font-size: 12px; color: var(--meta); }
  .feed .ago { text-align: right; font-size: 12px; line-height: 1.5; }
  .feed .ago b { display: block; color: var(--green); }
  /* ═══ setup: hairline steps + code */
  .setup .frame { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
  .setup .l, .setup .r { padding: 56px 72px 96px; }
  .setup .r { border-left: 1px solid var(--line); }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 44px 1fr; padding: 18px 0; border-top: 1px solid var(--line); }
  .steps li:last-child { border-bottom: 1px solid var(--line); }
  .steps li::before { content: "[0" counter(s) "]"; font: 400 12.5px/1.9 var(--mono); color: var(--meta); }
  .steps b { display: block; font-size: 16.5px; letter-spacing: -.015em; }
  .steps span { color: var(--muted); font-size: 15px; }
  .code { border-radius: 16px; background: #0e0e10; color: #e6e7ea; font: 400 14px/1.7 var(--mono); padding: 18px 20px; }
  .code .p { color: #a5b4fc; } .code .c { color: #8b8e94; }
  .note-box { margin-top: 16px; padding: 16px 18px; border-radius: 14px; background: var(--violet-bg); color: var(--ink); font-size: 15px; }
  .note-box b { color: var(--violet-ink); font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 4px; }

  /* ═══ end CTA (as on the landing) */
  .endcta { border-bottom: 0; }
  .endcta .frame { position: relative; overflow: hidden; text-align: center; background: radial-gradient(46% 62% at 50% 100%, rgba(247,170,92,.95) 0%, rgba(247,178,107,.6) 42%, rgba(247,178,107,0) 72%), radial-gradient(70% 80% at 50% 100%, rgba(120,170,255,.85) 0%, rgba(150,190,255,.6) 45%, rgba(200,222,255,.25) 70%, rgba(220,234,255,0) 88%), #fff; }
  .endcta .copy { position: relative; z-index: 2; padding: 128px 24px 0; }
  .endcta h2 { margin: 0 auto; max-width: 760px; font-size: clamp(2.2rem, 5vw, 3.75rem); line-height: 1.02; letter-spacing: -.04em; font-weight: 600; text-wrap: balance; }
  .endcta .grey2 { color: #8b8e94; }
  .endcta .small { margin: 24px 0 0; font-size: 14px; font-weight: 500; color: #8b8e94; }
  .endcta .rays { position: relative; height: clamp(320px, 38vw, 540px); margin-top: 64px; }
  .endcta canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .endfoot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: flex-start; padding: 28px 32px; font-size: 13px; font-weight: 500; color: rgba(28,29,31,.7); }
  .endfoot span { display: flex; align-items: center; gap: 8px; }

  /* ═══ FAQ (Attio) */
  .faq .frame { padding: 96px 24px; }
  .faq .in { max-width: 760px; margin: 0 auto; }
  .faq h2 { margin: 0 0 26px; font-size: 2.4rem; letter-spacing: -.04em; font-weight: 600; }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; display: flex; justify-content: space-between; gap: 20px; padding: 20px 0; cursor: pointer; font-weight: 500; font-size: 16.5px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "[+]"; font: 400 13px var(--mono); color: var(--meta); }
  .faq details[open] summary::after { content: "[−]"; }
  .faq details p { margin: 0 0 20px; color: var(--muted); }

  footer .frame { padding: 40px 72px; display: flex; justify-content: space-between; color: var(--meta); font-size: 13px; }

  @media (max-width: 1024px) {
    .setup .frame, .band .frame, .mhero .frame { grid-template-columns: 1fr; }

<script>
/* hero: a conveyor — every 2.8s a new role slides in from below as "tailoring…", the list rides up one
   row (the oldest fades out under the top mask), then the new role flips to "applied" with the time */
(() => {
  const tr = document.querySelector("[data-track]"); if (!tr || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const R = ["Product Designer · Stripe", "Senior Designer · Airbnb", "Data Analyst · Monzo", "Design Engineer · Vercel", "Product Designer · Figma", "UX Researcher · Spotify", "Frontend Engineer · Linear", "Product Manager · N26"];
  const H = 36; let k = 0;
  const step = () => {
    const row = document.createElement("div"); row.className = "row work";
    row.innerHTML = `<i></i><span class="st">tailoring</span><span class="nm">· ${R[k++ % R.length]}</span><em>now</em>`;
    tr.appendChild(row);
    tr.style.transform = `translateY(${H}px)`; // new row starts hidden below the window
    void tr.offsetHeight; // commit the start position, then let it ride up
    tr.classList.add("moving"); tr.style.transform = "translateY(0)";
    setTimeout(() => { // the list has moved: drop the top row without a jump
      tr.classList.remove("moving"); tr.firstElementChild.remove();
    }, 760);
    setTimeout(() => {
      const t = new Date(); row.className = "row ok"; row.querySelector(".st").textContent = "✓ applied";
      row.querySelector("em").textContent = `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
    }, 1700);
  };
  setInterval(step, 2800);
})();

(() => {

  const host = c.closest(".frame"), g = c.getContext("2d");
  let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const N = Array.from({ length: 420 }, () => { const y = 0.04 + rnd() * 0.96, t = rnd() * Math.PI * 2, r = Math.sqrt(1 - y * y);
    return { x: Math.cos(t) * r, y, z: Math.sin(t) * r, len: 0.45 + rnd() ** 0.8 * 0.55, w: rnd() < 0.18 ? 1.1 : 0.6, dot: rnd() < 0.6 ? 1 + rnd() * 1.8 : 0, a: 0.25 + rnd() * 0.5, ph: rnd() * 6.28, px: 0, py: 0, sx: 0, sy: 0, gl: 0 }; });

  const cs = Math.cos(0.4), sn = Math.sin(0.4), ct = Math.cos(0.1), st = Math.sin(0.1);

    g.clearRect(0, 0, W, H); const ox = W / 2, oy = H + 2, RX = Math.min(W * 0.5, H * 1.35), RY = H * 0.95, t = ms / 1000;

      const x1 = n.x * cs - n.z * sn, z1 = n.x * sn + n.z * cs, y2 = Math.max(0, n.y * ct - z1 * st), z2 = n.y * st + z1 * ct;
      const L = n.len * (1 + Math.sin(t * 1.3 + n.ph) * 0.04), p = 2.6 / (2.6 - z2 * 0.9);
      let tx = ox + x1 * L * RX * p, ty = oy - y2 * L * RY * p, near = 0;
      if (P.on) { const dx = n.sx - P.x, dy = n.sy - P.y, d2 = dx * dx + dy * dy; near = Math.exp(-d2 / 9800); const d = Math.sqrt(d2) || 1; n.px += ((dx / d) * near * 26 - n.px) * 0.15; n.py += ((dy / d) * near * 26 - n.py) * 0.15; } else { n.px *= 0.9; n.py *= 0.9; }
      n.gl += (near - n.gl) * 0.12; tx += n.px; ty += n.py; n.sx = tx; n.sy = ty;
      const dep = (z2 + 1) / 2, al = Math.min(1, n.a * (0.55 + dep * 0.6) + n.gl * 0.5), gr = g.createLinearGradient(ox, oy, tx, ty);
      gr.addColorStop(0, `rgba(246,160,80,${al * 0.5})`); gr.addColorStop(0.5, `rgba(130,140,250,${al * 0.65})`); gr.addColorStop(1, `rgba(60,75,235,${al})`);

(() => {

  setInterval(() => {
    let reset = false;
    lists.forEach((l, li) => { const rows = [...l.querySelectorAll(".role")], t = rows.find((r) => r.dataset.s === "tailor");

      };
    },
    sonar() {
      const fade = 2500, rings = [];
      for (let r = 20; r <= 80; r += 15) for (let i = 0; i < r / 2; i++) rings.push({ r, a: (i / (r / 2)) * Math.PI * 2, seen: -fade });
      return (ctx, ms, F, Sx) => {
        const a = (ms * 0.001 * (Math.PI / 2) * SPEED) % (Math.PI * 2);
        ctx.beginPath(); ctx.moveTo(C, C); ctx.lineTo(C + 85 * Math.cos(a), C + 85 * Math.sin(a)); ctx.strokeStyle = Sx(0.5); ctx.lineWidth = 1 * RS; ctx.stroke();
        for (const d of rings) {
          let diff = Math.abs(d.a - a); if (diff > Math.PI) diff = Math.PI * 2 - diff;
          if (diff < 0.05) d.seen = ms;
          const since = ms - d.seen;
          if (since < fade) { const o = 1 - ease(since / fade); dot(ctx, C + d.r * Math.cos(d.a), C + d.r * Math.sin(d.a), 1 + o * 1.5, F(o)); }
        }
      };
    },
    helix() {
      const N = 100, R = 35, H = 120, pts = Array.from({ length: N }, (_, i) => ({ a: i * 0.3, y: (i / N) * H - H / 2 }));
      return (ctx, ms, F) => {
        const t = ms * 0.001 * SPEED, scanY = Math.sin((t / 8) * Math.PI * 2) * (H / 2), up = Math.cos((t / 8) * Math.PI * 2) > 0, trail = H * 0.3;
        for (const d of pts) {
          const x = R * Math.cos(d.a + t), z = R * Math.sin(d.a + t), sc = (z + R) / (R * 2), dist = Math.abs(d.y - scanY);
          const lead = dist < 25 ? Math.cos((dist / 25) * Math.PI / 2) : 0, behind = d.y - scanY;
          const tr = (up && behind < 0 && -behind < trail) || (!up && behind > 0 && behind < trail) ? Math.pow(1 - Math.abs(behind) / trail, 2) * 0.4 : 0;
          const inf = Math.max(lead, tr);
          dot(ctx, C + x, C + d.y, sc * 1.8 + inf * 2.8, F(sc * 0.4 + inf * 0.6));
        }
      };
    },
    waves() {
      const rings = [{ r: 20, n: 12 }, { r: 45, n: 24 }, { r: 70, n: 36 }];
      return (ctx, ms, F, Sx) => {
        const t = ms * 0.001 * SPEED;
        rings.forEach((g, gi) => {
          if (gi >= rings.length - 1) return;
          const nx = rings[gi + 1], ratio = nx.n / g.n;
          for (let i = 0; i < g.n; i++) {
            const a1 = (i / g.n) * Math.PI * 2, p1 = Math.sin(t * 2 - gi * 0.4) * 3, x1 = C + Math.cos(a1) * (g.r + p1), y1 = C + Math.sin(a1) * (g.r + p1);
            for (let j = 0; j < ratio; j++) {
              const a2 = ((i * ratio + j) / nx.n) * Math.PI * 2, p2 = Math.sin(t * 2 - (gi + 1) * 0.4) * 3;
              ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(C + Math.cos(a2) * (nx.r + p2), C + Math.sin(a2) * (nx.r + p2));
              ctx.lineWidth = 0.75 * RS; ctx.strokeStyle = Sx(0.1 + ((Math.sin(t * 3 - gi * 0.5 + i * 0.3) + 1) / 2) * 0.4); ctx.stroke();
            }
          }
        });
        rings.forEach((g, gi) => { for (let i = 0; i < g.n; i++) { const a = (i / g.n) * Math.PI * 2, p = Math.sin(t * 2 - gi * 0.4) * 3; dot(ctx, C + Math.cos(a) * (g.r + p), C + Math.sin(a) * (g.r + p), 1.5, F(0.4 + Math.sin(t * 2 - gi * 0.4 + i * 0.2) * 0.6)); } });
      };
    },
    phased() {
      const radii = [20, 40, 60, 80], per = [12, 18, 24, 30], pts = [];
      radii.forEach((r, i) => { for (let j = 0; j < per[i]; j++) { const a = (j / per[i]) * Math.PI * 2; pts.push([Math.cos(a) * r, Math.sin(a) * r]); } });
      return (ctx, ms, F) => {
        const t = ms * 0.001 * SPEED, rx = 1.0, ry = t * 0.2, wave = (t * 120) % (80 * 1.8), out = [];
        for (let [x, y] of pts) {
          let z = 0, inf = 0; const d = Math.abs(Math.hypot(x, y) - wave);
          if (d < 25) { z = ease(Math.sin((1 - d / 25) * Math.PI)) * 18; inf = z / 18; }
          let tx = x * Math.cos(ry) - z * Math.sin(ry), tz = x * Math.sin(ry) + z * Math.cos(ry); x = tx; z = tz;
          let ty = y * Math.cos(rx) - z * Math.sin(rx); tz = y * Math.sin(rx) + z * Math.cos(rx); y = ty; z = tz;
          const sc = 300 / (300 + z + 100); out.push([C + x * sc, C + y * sc, z, (1.5 + inf * 2.5) * sc, 0.4 + inf * 0.6]);
        }
        out.sort((a, b) => a[2] - b[2]).forEach((p) => dot(ctx, p[0], p[1], p[3], F(p[4])));
      };
    },
    cube() {
      const g = 7, sp = 15, h = ((g - 1) * sp) / 2, max = Math.hypot(h, h, h), pts = [];
      for (let x = 0; x < g; x++) for (let y = 0; y < g; y++) for (let z = 0; z < g; z++) pts.push([x * sp - h, y * sp - h, z * sp - h]);
      return (ctx, ms, F) => {
        const t = ms * 0.0003 * SPEED, rx = t * 2, ry = t * 3, wave = (ms * 0.04 * SPEED) % (max * 1.5), out = [];
        for (let [x, y, z] of pts) {
          const dc = Math.hypot(x, y, z); let inf = 0;
          if (dc > 0 && Math.abs(dc - wave) < 20) { const dis = ease(Math.cos((Math.abs(dc - wave) / 20) * Math.PI / 2)) * 10, k = (dc + dis) / dc; x *= k; y *= k; z *= k; inf = dis / 10; }
          let tx = x * Math.cos(ry) - z * Math.sin(ry), tz = x * Math.sin(ry) + z * Math.cos(ry); x = tx; z = tz;
          let ty = y * Math.cos(rx) - z * Math.sin(rx); tz = y * Math.sin(rx) + z * Math.cos(rx); y = ty; z = tz;
          const sc = 250 / (250 + z), size = (1.5 + inf * 2.5) * sc;
          if (size > 0.1) out.push([C + x * sc, C + y * sc, z, size, Math.max(0.1, sc * 0.7 + inf * 0.4)]);
        }
        out.sort((a, b) => a[2] - b[2]).forEach((p) => dot(ctx, p[0], p[1], p[3], F(p[4])));
      };
    },
  };

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("canvas.anim").forEach((cv) => {
    const make = LOOPS[cv.dataset.anim]; if (!make) return;
    const draw = make(), ctx = cv.getContext("2d");
    const col = cv.dataset.color || "255,255,255", alpha = +(cv.dataset.alpha || 1);
    const F = (o) => `rgba(${col},${Math.max(0, Math.min(1, o)) * alpha})`;
    const size = +(cv.dataset.size || 1.6), cx = +(cv.dataset.x || 0.5), cy = +(cv.dataset.y || 0.5);
    let W = 0, H = 0, dpr = 1, raf = 0;
    const fit = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; };
    const frame = (ms) => {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
      const k = (Math.min(W, H) / S) * size * dpr;
      ctx.setTransform(k, 0, 0, k, W * cx * dpr - C * k, H * cy * dpr - C * k);
      RS = (dpr * 1.25) / k;
      draw(ctx, ms, F, F);
    };
    const loop = (ms) => { frame(ms); raf = requestAnimationFrame(loop); };
    fit(); frame(4000);
    new ResizeObserver(() => { fit(); frame(performance.now()); }).observe(cv);
    if (reduce) return;
    new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !raf) raf = requestAnimationFrame(loop);
      else if (!e.isIntersecting && raf) { cancelAnimationFrame(raf); raf = 0; }
    }).observe(cv);
  });
})();
</script>
