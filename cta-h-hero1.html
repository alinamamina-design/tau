<!doctype html>
<html lang="en">
<head>
<base target="_top" />
<meta charset="utf-8" />

<title>hero1</title>
<!--
  Hero visuals, take 2 — quieter and more editorial: fewer elements, one idea each.
  1 · Sphere: a monochrome dot sphere scanning, three roles drift out of it.
  2 · Stack: a 3D stack of roles; the top one is applied and slides away.
  3 · Query: the agent's search as big light type, results as hairline rows.
  Built by design/build-cta.py → public/hero-content.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1c1d1f; --body: #3c3e43; --muted: #6f7277; --meta: #6e7177; --faint: #9a9da3;
    --line: #ececee; --line-2: #e6e7ea; --chip: #f1f1f3;
    --violet: #6d5dfb; --violet-ink: #5644e6;
    --grad: linear-gradient(90deg, #2563eb 0%, #6d5dfb 52%, #9333ea 100%);
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 400 16px/1.5 Inter, system-ui, sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; background: #fff; }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; text-decoration: none; }
  .frame { position: relative; max-width: 1280px; margin: 0 auto; background: #fff; }
  .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .top { border-bottom: 1px solid var(--line); }
  .top .frame { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 28px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; }
  .note { font-size: 13px; color: var(--meta); }
  .label { }
  .label .frame { padding: 40px 72px 0; font: 500 12.5px var(--mono); color: var(--meta); }
  .label b { color: var(--ink); font-weight: 500; }

  .hero { border-bottom: 1px solid var(--line); }
  .hero .frame { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); gap: 64px; align-items: center; padding: 72px; min-height: 660px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; font-weight: 500; color: var(--body); }
  .hero h1 { margin: 22px 0 0; font-size: clamp(2.6rem, 4.6vw, 4.1rem); line-height: 1.02; letter-spacing: -.05em; font-weight: 600; text-wrap: balance; }
  .hero .lead { margin: 20px 0 0; max-width: 540px; font-size: 19px; color: var(--muted); }
  .meta { display: flex; gap: 12px; margin-top: 24px; font-size: 14px; color: var(--meta); font-weight: 500; }

  .k { font: 500 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--meta); }
  .lnk { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; font-size: 15px; box-shadow: 0 12px 26px -12px rgba(28,29,31,.55); transition: background .2s, transform .2s; }
  .lnk:hover { background: #000; transform: translateY(-1px); }
  .dark .lnk, .s1 .lnk { background: #fff; color: var(--ink); box-shadow: 0 12px 30px -12px rgba(167,139,250,.6); }
  .dark .lnk:hover, .s1 .lnk:hover { background: #f1efff; }
  .lnk .ar { transition: transform .25s cubic-bezier(.16,1,.3,1); } .lnk:hover .ar { transform: translateX(4px); }
  .logo { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; }
  .logo svg { width: 58%; height: 58%; fill: #fff; }

  /* ═══ 1 · Sphere — black, one dot sphere, three roles drift out */
  .s1 { position: relative; height: 540px; border-radius: 26px; overflow: hidden; background: #0b0b0c; color: #fff; }
  .s1 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .s1 .hd { position: absolute; left: 28px; right: 28px; top: 26px; display: flex; justify-content: space-between; }
  .s1 .hd .k { color: #8b8e94; }
  .s1 .hd .cnt { font: 500 11.5px var(--mono); color: #c4b5fd; letter-spacing: .06em; }
  .tag { position: absolute; display: flex; align-items: center; gap: 9px; padding: 8px 12px 8px 8px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); font-size: 13px; color: #e6e7ea; white-space: nowrap; opacity: 0; transform: translateY(8px); transition: opacity .9s, transform .9s cubic-bezier(.16,1,.3,1); }
  .tag.on { opacity: 1; transform: none; }
  .tag em { font-style: normal; font-size: 13.5px; font-weight: 600; letter-spacing: -.02em; color: #fff; margin-left: 6px; padding-left: 9px; border-left: 1px solid rgba(255,255,255,.18); }
  .s1 .ft { position: absolute; left: 28px; right: 28px; bottom: 26px; display: flex; justify-content: space-between; align-items: center; }
  .s1 .ft span { font: 400 12.5px var(--mono); color: #8b8e94; }

  /* ═══ 2 · Stack — white, a 3D stack of roles, the top one is applied and slides off */
  .s2 { position: relative; height: 540px; border-radius: 26px; background: linear-gradient(180deg, #fbfbfc, #f3f3f6); border: 1px solid var(--line); overflow: hidden; }
  .s2::before { content: ""; position: absolute; left: 50%; top: 52%; width: 420px; height: 420px; translate: -50% -50%; border-radius: 50%; background: radial-gradient(closest-side, rgba(109,93,251,.16), transparent); }
  .s2 .hd { position: absolute; left: 28px; right: 28px; top: 26px; display: flex; justify-content: space-between; align-items: center; }
  .s2 .hd img { width: 34px; }
  .deck { position: absolute; left: 50%; top: 50%; width: 330px; height: 196px; translate: -50% -46%; }
  .card { position: absolute; inset: 0; border-radius: 18px; padding: 20px; background: #fff; border: 1px solid var(--line); box-shadow: 0 30px 60px -36px rgba(30,30,80,.45); display: flex; flex-direction: column; justify-content: space-between; transition: transform .8s cubic-bezier(.65,0,.35,1), opacity .8s; }
  .card .row { display: flex; justify-content: space-between; align-items: center; }
  .card .co { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .card .h4 { margin: 0; font-size: 22px; line-height: 1.12; letter-spacing: -.03em; font-weight: 600; }
  .card .m { font: 500 12px var(--mono); color: var(--muted); }
  .card .m b { color: var(--ink); font: 600 17px Inter, sans-serif; letter-spacing: -.02em; }
  .card .st { font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .card.top .st { color: var(--violet-ink); }
  .card.done .st { color: var(--ink); }
  .card .bar { height: 2px; border-radius: 1px; background: var(--chip); overflow: hidden; }
  .card .bar i { display: block; height: 100%; width: 0; background: var(--grad); }
  .card.top .bar i { animation: fill 1.6s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes fill { to { width: 100%; } }
  .s2 .ft { position: absolute; left: 28px; right: 28px; bottom: 26px; display: flex; justify-content: space-between; align-items: center; }
  .s2 .ft span { font: 400 12.5px var(--mono); color: var(--meta); }

  /* ═══ 3 · Query — big light type for the search, hairline results */
  .s3 { position: relative; height: 540px; border-radius: 26px; padding: 30px; background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  .s3::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--grad); }
  .s3 .hd { display: flex; justify-content: space-between; }
  .q { margin: 26px 0 0; min-height: 2.3em; font-size: 34px; line-height: 1.12; letter-spacing: -.04em; font-weight: 300; color: var(--ink); }
  .q .cur { display: inline-block; width: 2px; height: .9em; margin-left: 2px; vertical-align: -.08em; background: var(--violet); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .res { position: relative; margin: 22px 0 0; flex: 1; }
  .res .ln { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 12px; height: 52px; border-top: 1px solid var(--line); font-size: 14px; opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s cubic-bezier(.16,1,.3,1), color .4s; }
  .res .ln:last-child { border-bottom: 1px solid var(--line); }
  .res .ln.on { opacity: 1; transform: none; }
  .res .ln b { font-weight: 500; } .res .ln small { color: var(--meta); margin-left: 6px; }
  .res .ln span.v { font-size: 13.5px; font-weight: 600; letter-spacing: -.02em; color: var(--faint); transition: color .4s; }
  .res .ln.hit span.v { color: var(--ink); }
  .res .ln.skip { color: var(--faint); } .res .ln.skip .logo { filter: grayscale(1); opacity: .5; }
  .beam { position: absolute; left: 0; right: 0; height: 52px; top: 0; background: linear-gradient(90deg, transparent, rgba(109,93,251,.09), transparent); border-left: 2px solid var(--violet); opacity: 0; transition: top .5s cubic-bezier(.65,0,.35,1), opacity .3s; pointer-events: none; }
  .s3 .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .s3 .ft span { font: 400 12.5px var(--mono); color: var(--meta); }


  /* ═══ 6 · Network — Tau at the centre of a dot network; outer nodes light up as roles are found */
  .s6 { position: relative; height: 540px; border-radius: 26px; overflow: hidden; background: radial-gradient(60% 60% at 50% 48%, #1b1640, #0b0b0c 70%); color: #fff; }
  .s6 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .s6 .hd { position: absolute; left: 28px; right: 28px; top: 26px; display: flex; justify-content: space-between; }
  .s6 .hd .k { color: #8b8e94; } .s6 .hd .cnt { font: 500 11.5px var(--mono); color: #c4b5fd; }
  .s6 .core { position: absolute; left: 50%; top: 47%; width: 64px; height: 64px; translate: -50% -50%; display: grid; place-items: center; border-radius: 18px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(8px); box-shadow: 0 0 50px rgba(109,93,251,.5); }
  .s6 .ft { position: absolute; left: 28px; right: 28px; bottom: 26px; display: flex; justify-content: space-between; align-items: center; }
  .s6 .ft span { font: 400 12.5px var(--mono); color: #8b8e94; }
  .offer { position: absolute; z-index: 2; display: flex; align-items: center; gap: 11px; padding: 10px 14px 10px 10px; border-radius: 14px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(12px); box-shadow: 0 20px 40px -20px rgba(0,0,0,.6); opacity: 0; transform: translateY(8px) scale(.97); transition: opacity .8s, transform .8s cubic-bezier(.16,1,.3,1); }
  .offer.on { opacity: 1; transform: none; }
  .offer .logo { width: 30px; height: 30px; border-radius: 9px; }
  .offer .tx { line-height: 1.2; }
  .offer em { display: block; font-style: normal; font: 500 10.5px var(--mono); letter-spacing: .04em; color: #a78bfa; }
  .offer b { display: block; margin-top: 3px; font-size: 18px; font-weight: 600; letter-spacing: -.03em; color: #fff; font-variant-numeric: tabular-nums; }
  .offer b small { font-size: 11px; font-weight: 500; color: #8b8e94; letter-spacing: 0; }
  .offer .tx > span { font-size: 11.5px; color: #8b8e94; }
  footer { padding: 40px 72px; color: var(--meta); font-size: 13px; }
  @media (max-width: 1024px) { .hero .frame { grid-template-columns: 1fr; padding: 40px 24px; gap: 40px; min-height: 0; } .label .frame { padding: 14px 24px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 05 — plaque: job rows + one headline, one line, one button */
.s5 { align-self: center; padding: 28px; border-radius: 22px; background: radial-gradient(120% 100% at 0% 0%, #eef0ff 0%, #f5f2ff 45%, #fbf9ff 100%); border: 1px solid #e6e3fb; }
.s5 .jl { margin-bottom: 24px; border-radius: 14px; background: #fff; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 24px 44px -26px rgba(40,30,120,.45); }
.s5 .jr { display: flex; align-items: center; gap: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--ink); }
.s5 .jr + .jr { border-top: 1px solid #ececee; }
.s5 .jt { flex: 1; min-width: 0; line-height: 1.25; } .s5 .jt b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .s5 .jt span { font-size: 12.5px; color: #75787e; }
.s5 .sal { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.s5 .ok, .s5 .go { flex: none; padding: 3px 8px; border-radius: 7px; font-size: 12px; font-weight: 600; }
.s5 .ok { background: #e7f6ec; color: #1a7f3c; } .s5 .go { background: #f1efff; color: #5644e6; }
.s5 h2 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -.03em; font-weight: 600; }
.s5 p { margin: 8px 0 20px; font-size: 15.5px; color: #4a4c52; }
@media (max-width: 720px) { .s5 { padding: 16px 16px 22px; } .s5 .ok, .s5 .go { display: none; } }
</style>
</head>

<section class="hb dark"><div class="hb-in">
  <div class="hb-copy"><h2>Your agent scans LinkedIn for you</h2><p>New roles that fit, minutes after posting</p><a class="hb-btn" href="onboarding/">Launch my agent <svg viewBox="0 0 16 16"><path d="M3 8h9.5M8.5 3.5 13 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg></a></div>

<style id="hb">
  html, body { margin: 0; overflow: hidden; background: #fff !important; }

  .hb.dark { background: #0f1013; color: #fff; }

  .hb.dark .hb-stage { border-color: rgba(255,255,255,.1); }
  .hb.dark .hb-stage::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 72px 72px; -webkit-mask: radial-gradient(70% 70% at 50% 50%, #000, transparent); mask: radial-gradient(70% 70% at 50% 50%, #000, transparent); }
  .hb.light .hb-stage::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, #d4d6da 1px, transparent 1.2px); background-size: 22px 22px; opacity: .7; }

  @media (max-width: 1000px) { .hb-in { grid-template-columns: 1fr; } .hb-copy { padding: 48px 24px; } .hb-stage { border-left: 0; } .hb-stage > aside { min-height: 460px; } }
</style>

<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // 01 · dot sphere (Fibonacci points, a slow turn, a scan band) — monochrome; tags fade in over time
  const S1 = document.querySelector("[data-s1]");
  if (S1) {
    const c = S1.querySelector("canvas"), g = c.getContext("2d"), tags = [...S1.querySelectorAll(".tag")], cnt = S1.querySelector("[data-c1]");
    let W = 0, H = 0; const fit = () => { const d = Math.min(devicePixelRatio || 1, 2); W = S1.clientWidth; H = S1.clientHeight; c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); }; fit(); new ResizeObserver(fit).observe(S1);
    const N = 520, P = Array.from({ length: N }, (_, i) => { const th = Math.acos(1 - 2 * (i + .5) / N), ph = Math.PI * (1 + Math.sqrt(5)) * i; return [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)]; });
    const draw = (ms) => {
      g.clearRect(0, 0, W, H); const R = Math.min(W, H) * .32, cx = W / 2, cy = H / 2 + 6, t = ms / 1000, ry = t * .18, rx = .35, scan = Math.sin(t * .9) * R;
      for (const [x0, y0, z0] of P) {
        let x = x0 * Math.cos(ry) - z0 * Math.sin(ry), z = x0 * Math.sin(ry) + z0 * Math.cos(ry), y = y0 * Math.cos(rx) - z * Math.sin(rx); z = y0 * Math.sin(rx) + z * Math.cos(rx);
        const px = cx + x * R, py = cy + y * R, depth = (z + 1) / 2, d = Math.abs(py - cy - scan), hot = d < 18 ? 1 - d / 18 : 0;
        g.fillStyle = hot > 0 ? `rgba(196,181,253,${.35 + hot * .65})` : `rgba(255,255,255,${.06 + depth * .32})`;
        g.beginPath(); g.arc(px, py, .6 + depth * 1.1 + hot * 1.2, 0, 6.28); g.fill();
      }
    };
    if (reduce) { draw(0); tags.forEach((t) => t.classList.add("on")); cnt.textContent = "3 matches"; }
    else {
      let on = false; new IntersectionObserver(([e]) => (on = e.isIntersecting)).observe(S1); const loop = (ms) => { if (on) draw(ms); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
      (async () => { for (;;) { for (let i = 0; i < tags.length; i++) { await sleep(1400); tags[i].classList.add("on"); cnt.textContent = `${i + 1} match${i ? "es" : ""}`; } await sleep(3200); tags.forEach((t) => t.classList.remove("on")); cnt.textContent = "0 matches"; await sleep(900); } })();
    }
  }

  // 02 · the deck: top card tailors (bar fills) → APPLIED → flies off; the stack moves up; a new card joins at the back
  const deck = document.querySelector("[data-deck]");
  if (deck) {
    const J = [["#635BFF", "Stripe", "Product Designer", "Berlin", "€185k"], ["#1ED760", "Spotify", "Senior Product Designer", "Remote", "€170k"], ["#5E6AD2", "Linear", "Design Engineer", "EU", "€210k"], ["#FF5A5F", "Airbnb", "Product Designer", "Remote", "€180k"], ["#F24E1E", "Figma", "Product Designer, Editor", "London", "£165k"]];
    let k = 0, applied = 17; const c2 = document.querySelector("[data-c2]");
    const make = () => { const [bg, co, t, loc, m] = J[k++ % J.length]; const el = document.createElement("div"); el.className = "card"; el.innerHTML = `<div class="row"><span class="co"><span class="logo" style="background:${bg}"><svg><use href="#lg-${co}" /></svg></span>${co} · ${loc}</span><span class="st">Queued</span></div><p class="h4">${t}</p><div><div class="row" style="margin-bottom:10px"><span class="m">salary <b>${m}</b> / year</span></div><div class="bar"><i></i></div></div>`; return el; };
    const lay = () => [...deck.children].forEach((el, i) => { el.style.transform = `translateY(${-i * 16}px) scale(${1 - i * .06})`; el.style.opacity = i > 2 ? 0 : 1; el.style.filter = i ? `brightness(${1 - i * .04})` : 'none'; el.querySelector('.h4').style.opacity = el.querySelector('.co').style.opacity = i ? 0 : 1; el.style.zIndex = 10 - i; el.classList.toggle("top", i === 0); if (i === 0 && !el.classList.contains("done")) el.querySelector(".st").textContent = "Tailoring CV"; });
    for (let i = 0; i < 4; i++) deck.appendChild(make()); lay();
    if (!reduce) (async () => { for (;;) {
      await sleep(1800); const top = deck.firstElementChild; top.classList.add("done"); top.querySelector(".st").textContent = "✓ Applied"; c2.textContent = `${++applied > 20 ? (applied = 18) : applied} applied today`;
      await sleep(900); top.style.transform = "translate(140%, -10px) rotate(8deg)"; top.style.opacity = 0;
      await sleep(700); top.remove(); deck.appendChild(make()); lay();
    } })();
  }

  // 03 · the query types itself, results arrive, the beam reads each: skip or match
  const S3 = document.querySelector("[data-s3]");
  if (S3) {
    const q = S3.querySelector("[data-q]"), rows = S3.querySelector("[data-rows]"), beam = S3.querySelector("[data-beam]"), c3 = S3.querySelector("[data-c3]");
    const R = [["#635BFF", "Stripe", "Product Designer", "2h", 1, "€185k · apply"], ["#000", "Notion", "Visual Designer (contract)", "3w", 0, "€60k · skip"], ["#1ED760", "Spotify", "Senior Product Designer", "40m", 1, "€170k · apply"], ["#191C1F", "Revolut", "Junior UI Designer", "1d", 0, "£45k · skip"], ["#5E6AD2", "Linear", "Design Engineer", "5h", 1, "€210k · apply"]];
    const Q = "Product designer, Berlin or remote, €150k+";
    rows.innerHTML = R.map(([bg, co, t, ago]) => `<div class="ln"><span class="logo" style="background:${bg}"><svg><use href="#lg-${co}" /></svg></span><span><b>${t}</b><small>${co} · ${ago}</small></span><span class="v">…</span></div>`).join("");
    const L = [...rows.children];
    if (reduce) { q.textContent = Q; L.forEach((l, i) => { l.classList.add("on", R[i][4] ? "hit" : "skip"); l.querySelector(".v").textContent = R[i][5]; }); c3.textContent = "3 to apply"; }
    else (async () => { for (;;) {
      q.textContent = ""; L.forEach((l) => { l.className = "ln"; l.querySelector(".v").textContent = "…"; }); beam.style.opacity = 0; c3.textContent = "searching";
      for (const ch of Q) { q.textContent += ch; await sleep(42); }
      await sleep(300); for (const l of L) { l.classList.add("on"); await sleep(120); }
      c3.textContent = "reading"; let n = 0;
      for (let i = 0; i < L.length; i++) { beam.style.top = L[i].offsetTop + "px"; beam.style.opacity = 1; await sleep(700); L[i].classList.add(R[i][4] ? "hit" : "skip"); L[i].querySelector(".v").textContent = R[i][5]; if (R[i][4]) c3.textContent = `${++n} to apply`; }
      beam.style.opacity = 0; await sleep(3000);
    } })();
  }

  // 06 · network: rings of dots linked to the centre; pulses travel out, the node they reach lights up
  const S6 = document.querySelector("[data-s6]");
  if (S6) {
    const c = S6.querySelector("canvas"), g = c.getContext("2d");
    let W = 0, H = 0; const fit = () => { const d = Math.min(devicePixelRatio || 1, 2); W = S6.clientWidth; H = S6.clientHeight; c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); }; fit(); new ResizeObserver(fit).observe(S6);
    const nodes = []; [[90, 10], [150, 18], [205, 26]].forEach(([r, n], ri) => { for (let i = 0; i < n; i++) nodes.push({ r, a: (i / n) * Math.PI * 2 + ri * .2, lit: -1e9, ring: ri }); });
    const pulses = [], offers = [...S6.querySelectorAll(".offer")], c6 = S6.querySelector("[data-c6]"); let found = 0, link = null;
    const draw = (ms) => {
      g.clearRect(0, 0, W, H); const cx = W / 2, cy = H * .47, t = ms / 1000;
      const pos = (n) => [cx + Math.cos(n.a + t * .03 * (n.ring + 1)) * n.r, cy + Math.sin(n.a + t * .03 * (n.ring + 1)) * n.r * .82];
      g.lineWidth = .6;
      nodes.forEach((n) => { if (n.ring !== 2) return; const [x, y] = pos(n); g.strokeStyle = "rgba(255,255,255,.05)"; g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.stroke(); });
      nodes.forEach((n) => { const [x, y] = pos(n), age = (ms - n.lit) / 1000, on = age < 2.6 ? 1 - age / 2.6 : 0; g.fillStyle = on ? `rgba(196,181,253,${.4 + on * .6})` : "rgba(255,255,255,.22)"; g.beginPath(); g.arc(x, y, 1.6 + on * 3, 0, 6.28); g.fill(); if (on > .5) { g.strokeStyle = `rgba(196,181,253,${on - .5})`; g.beginPath(); g.arc(x, y, 6 + (1 - on) * 16, 0, 6.28); g.stroke(); } });
      for (let i = pulses.length - 1; i >= 0; i--) { const p = pulses[i], k = Math.min(1, (ms - p.t0) / 900), [x, y] = pos(p.n); g.fillStyle = "#c4b5fd"; g.beginPath(); g.arc(cx + (x - cx) * k, cy + (y - cy) * k, 2, 0, 6.28); g.fill(); if (k >= 1) { p.n.lit = ms; pulses.splice(i, 1); } }
      // a thin line from the core to the newest offer
      if (link) { const b = link.getBoundingClientRect(), h = S6.getBoundingClientRect(), tx = b.left - h.left + (b.left - h.left < W / 2 ? b.width : 0), ty = b.top - h.top + b.height / 2, age = Math.min(1, (ms - link.t0) / 700);
        const gr = g.createLinearGradient(cx, cy, tx, ty); gr.addColorStop(0, "rgba(196,181,253,.0)"); gr.addColorStop(1, `rgba(196,181,253,${.55 * age})`); g.strokeStyle = gr; g.lineWidth = 1; g.setLineDash([3, 4]); g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + (tx - cx) * age, cy + (ty - cy) * age); g.stroke(); g.setLineDash([]); }
    };
    if (reduce) { offers.forEach((o) => o.classList.add("on")); c6.textContent = offers.length; draw(0); }
    else { let on = false; new IntersectionObserver(([e]) => (on = e.isIntersecting)).observe(S6); const loop = (ms) => { if (on) draw(ms); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
      setInterval(() => { const outer = nodes.filter((n) => n.ring === 2); pulses.push({ n: outer[(Math.random() * outer.length) | 0], t0: performance.now() }); }, 700);
      // offers land one by one, then the loop starts over
      (async () => { for (;;) { for (const o of offers) { await sleep(1700); o.classList.add("on"); link = o; link.t0 = performance.now(); c6.textContent = ++found; } await sleep(3200); offers.forEach((o) => o.classList.remove("on")); link = null; found = 0; c6.textContent = 0; await sleep(900); } })(); }
  }
})();
</script>
